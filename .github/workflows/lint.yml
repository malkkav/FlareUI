name: Lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lua-lint:
    name: Lua lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run Luacheck
        uses: lunarmodules/luacheck@v1.2.0
        with:
          args: --config tools/.luacheckrc .
