name: Tests

# Runs every Lua test in tools/tests with LuaJIT (Lua 5.1, like WoW): on pull requests, on pushes
# to main, and before each release (release.yml calls it; a failing test stops the upload).
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Lua tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: tests-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LuaJIT
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "luajit-2.1"

      - name: Run tests
        shell: bash
        run: |
          failed=()
          for test in tools/tests/*.lua; do
            if [[ "$test" == tools/tests/perf-helpers.lua ]]; then
              continue
            fi
            printf '\nRunning %s\n' "$test"
            luajit "$test" || failed+=("$test")
          done
          if (( ${#failed[@]} > 0 )); then
            printf '\nFailed tests:\n'
            printf '  %s\n' "${failed[@]}"
            printf '::error title=Lua test failed::%s\n' "${failed[@]}"
            exit 1
          fi
