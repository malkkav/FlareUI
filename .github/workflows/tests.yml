name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Lua tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install LuaJIT
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends luajit

      - name: Run tests
        shell: bash
        run: |
          status=0
          for test in tools/tests/*.lua; do
            if [[ "$test" == tools/tests/perf-helpers.lua ]]; then
              continue
            fi
            printf '\nRunning %s\n' "$test"
            luajit "$test" || status=1
          done
          exit "$status"
