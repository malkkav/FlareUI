# Packages FlareUI and uploads it to CurseForge, Wago and a GitHub release whenever a version tag
# is pushed, e.g. "1.1". The packager reads .pkgmeta, names the zip, attaches CHANGELOG.md
# and maps Interface 16001 to the WoW: Forever game version on both sites.
#
# Beta builds: a tag with "beta" in it (e.g. "6.11-beta1") uploads as Beta on CurseForge and Wago
# and as a pre-release on GitHub; "alpha" works the same way. Players only get these if they set
# FlareUI to Beta in the CurseForge or Wago app. Beta tags are not posted to the Discord changelog
# forum. Flow: TOC "## Version: 6.11-beta1", CHANGELOG heading "# FlareUI 6.11-beta1", tag
# 6.11-beta1. At release, rename both to "6.11", run newtags.js, tag 6.11.
name: Package and release

on:
  push:
    tags:
      - "*"

jobs:
  # the Lua tests first (tests.yml): if one fails, nothing is packaged or uploaded
  tests:
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to create the GitHub release
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      DISCORD_CHANGELOG_WEBHOOK: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}   # read by the step's if: below
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Package and upload
        uses: BigWigsMods/packager@v2

      # The tag's CHANGELOG.md section becomes a post in the Discord changelog forum
      # (tools/discord-changelog.js). Skipped without the webhook secret and for beta/alpha tags; a
      # Discord failure never marks the release as failed.
      - name: Post the changelog to Discord
        if: ${{ env.DISCORD_CHANGELOG_WEBHOOK != '' && !contains(github.ref_name, 'beta') && !contains(github.ref_name, 'alpha') }}
        continue-on-error: true
        run: node tools/discord-changelog.js "$GITHUB_REF_NAME"
        env:
          DISCORD_TAG_MAJOR: ${{ vars.DISCORD_TAG_MAJOR }}
          DISCORD_TAG_UPDATE: ${{ vars.DISCORD_TAG_UPDATE }}
          DISCORD_TAG_HOTFIX: ${{ vars.DISCORD_TAG_HOTFIX }}
          DISCORD_TAG_RESTART: ${{ vars.DISCORD_TAG_RESTART }}
          DISCORD_TAG_DEFAULTS: ${{ vars.DISCORD_TAG_DEFAULTS }}
